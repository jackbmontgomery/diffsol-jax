name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # diffsol main with diffsol_ode_options_set_max_number_timesteps (#460); the diffsol-c 0.9.0 API
  DIFFSOL_REF: fc0c409e8af196d474d7326348429d90145704fe
  GOPJRT_VERSION: v0.10.0
  # newer Pythons can lack scipy/numpy wheels, which then fail to build from source (no Fortran toolchain)
  UV_PYTHON: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff check
        run: uvx ruff check .
      - name: Ruff format check
        run: uvx ruff format --check .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plugin_asset: gomlx_xlabuilder_linux_amd64.tar.gz
            plugin_path: lib/gomlx/pjrt/pjrt_c_api_cpu_plugin.so
          - os: macos-15
            plugin_asset: gopjrt_cpu_darwin_arm64.tar.gz
            plugin_path: pjrt_c_api_cpu_plugin.so
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout diffsol
        uses: actions/checkout@v4
        with:
          repository: martinjrobins/diffsol
          ref: ${{ env.DIFFSOL_REF }}
          path: diffsol
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: diffsol
      - name: Build diffsol-c
        working-directory: diffsol
        run: cargo build -p diffsol-c --release
      - name: Cache PJRT CPU plugin
        id: plugin-cache
        uses: actions/cache@v4
        with:
          path: .pjrt
          key: pjrt-${{ matrix.os }}-${{ env.GOPJRT_VERSION }}
      - name: Download PJRT CPU plugin
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .pjrt
          curl -sL -o plugin.tar.gz \
            "https://github.com/gomlx/gopjrt/releases/download/${{ env.GOPJRT_VERSION }}/${{ matrix.plugin_asset }}"
          tar -xzf plugin.tar.gz "${{ matrix.plugin_path }}"
          cp "${{ matrix.plugin_path }}" .pjrt/pjrt_c_api_cpu_plugin.so
          rm -rf plugin.tar.gz lib
      - name: Install Python environment
        run: uv sync --no-default-groups --group test
      - name: Build libdiffsol_jax
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DDIFFSOL_C_DIR="$GITHUB_WORKSPACE/diffsol/target/release" \
            -DXLA_FFI_INCLUDE_DIR="$(.venv/bin/python -c 'import jax.ffi; print(jax.ffi.include_dir())')"
          cmake --build build -j4
      - name: Run tests
        env:
          DIFFSOL_JAX_PJRT_PLUGIN: ${{ github.workspace }}/.pjrt/pjrt_c_api_cpu_plugin.so
        run: .venv/bin/python -m pytest tests -q

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            plugin_asset: gomlx_xlabuilder_linux_amd64.tar.gz
            plugin_path: lib/gomlx/pjrt/pjrt_c_api_cpu_plugin.so
          - os: macos-15
            plugin_asset: gopjrt_cpu_darwin_arm64.tar.gz
            plugin_path: pjrt_c_api_cpu_plugin.so
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Checkout diffsol
        uses: actions/checkout@v4
        with:
          repository: martinjrobins/diffsol
          ref: ${{ env.DIFFSOL_REF }}
          path: diffsol
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: diffsol
      - name: Build diffsol-c
        working-directory: diffsol
        run: cargo build -p diffsol-c --release
      - name: Build wheel
        env:
          CMAKE_ARGS: -DDIFFSOL_C_DIR=${{ github.workspace }}/diffsol/target/release
        run: uv build --wheel --out-dir dist
      - name: Cache PJRT CPU plugin
        id: plugin-cache
        uses: actions/cache@v4
        with:
          path: .pjrt
          key: pjrt-${{ matrix.os }}-${{ env.GOPJRT_VERSION }}
      - name: Download PJRT CPU plugin
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .pjrt
          curl -sL -o plugin.tar.gz \
            "https://github.com/gomlx/gopjrt/releases/download/${{ env.GOPJRT_VERSION }}/${{ matrix.plugin_asset }}"
          tar -xzf plugin.tar.gz "${{ matrix.plugin_path }}"
          cp "${{ matrix.plugin_path }}" .pjrt/pjrt_c_api_cpu_plugin.so
          rm -rf plugin.tar.gz lib
      - name: Test wheel
        # the tests run from outside the repository, so that `import diffsol_jax` resolves to
        # the installed wheel (with its bundled libdiffsol_jax and libdiffsol_c), not to python/
        env:
          DIFFSOL_JAX_PJRT_PLUGIN: ${{ github.workspace }}/.pjrt/pjrt_c_api_cpu_plugin.so
        run: |
          uv venv wheel-venv --python 3.13
          uv pip install --python wheel-venv/bin/python dist/*.whl pytest
          cp -r tests "$RUNNER_TEMP/tests"
          "$GITHUB_WORKSPACE/wheel-venv/bin/python" -m pytest "$RUNNER_TEMP/tests" -q
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist
        run: uv build --sdist --out-dir dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    # TODO before the first PyPI release: build the linux wheel in a manylinux container
    # (PyPI rejects plain linux_x86_64 wheels) and audit the bundled libraries.
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, wheels, sdist]
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
