name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff check
        run: uvx ruff check .
      - name: Ruff format check
        run: uvx ruff format --check .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Python environment
        run: uv sync --no-default-groups --group test --extra cpu
      - name: Build libdiffsol_jax
        run: cargo build --release
      - name: Run tests
        run: .venv/bin/python -m pytest tests -q

  wheels-linux:
    name: Wheel (ubuntu-22.04)
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: uv build --wheel --out-dir wheelhouse
      - name: Repair wheel for manylinux
        run: uvx auditwheel repair wheelhouse/*.whl -w dist
      - name: Test wheel on each supported Python (the py3-none wheel has no CPython ABI)
        run: |
          whl=(dist/*.whl)
          for py in 3.12 3.13; do
            uv venv "wheel-venv-$py" --python "$py"
            uv pip install --python "wheel-venv-$py/bin/python" "${whl}[cpu]" pytest
            cp -r tests "$RUNNER_TEMP/tests-$py"
            "$GITHUB_WORKSPACE/wheel-venv-$py/bin/python" -m pytest "$RUNNER_TEMP/tests-$py" -q
          done
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ubuntu-22.04
          path: dist/*.whl

  wheels-macos:
    name: Wheel (macos-15)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Test wheel on each supported Python (the py3-none wheel has no CPython ABI)
        run: |
          whl=(dist/*.whl)
          for py in 3.12 3.13; do
            uv venv "wheel-venv-$py" --python "$py"
            uv pip install --python "wheel-venv-$py/bin/python" "${whl}[cpu]" pytest
            cp -r tests "$RUNNER_TEMP/tests-$py"
            "$GITHUB_WORKSPACE/wheel-venv-$py/bin/python" -m pytest "$RUNNER_TEMP/tests-$py" -q
          done
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-15
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist
        run: uv build --sdist --out-dir dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, wheels-linux, wheels-macos, sdist]
    environment: pypi
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
