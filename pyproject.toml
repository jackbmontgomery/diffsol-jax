[build-system]
requires = ["scikit-build-core>=0.11", "jax>=0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "diffsol-jax"
version = "0.1.0"
description = "diffsol solves as JAX operations: write the ODE equations as JAX functions, use them in jax.jit, jax.vmap and jax.grad."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jack Montgomery", email = "jackbmontgomery2001@gmail.com" }]
keywords = ["jax", "ode", "differential-equations", "diffsol", "scientific-computing", "autodiff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.12",
]

[project.urls]
Homepage = "https://github.com/jackbmontgomery/diffsol-jax"
Repository = "https://github.com/jackbmontgomery/diffsol-jax"
Issues = "https://github.com/jackbmontgomery/diffsol-jax/issues"

[tool.scikit-build]
wheel.packages = ["python/diffsol_jax"]
cmake.version = ">=3.20"
# DIFFSOL_C_DIR must point at a built diffsol-c (libdiffsol_c + include/diffsol.h),
# e.g. CMAKE_ARGS="-DDIFFSOL_C_DIR=/path/to/diffsol/target/release" pip wheel .

[tool.uv]
# The native library is built with cmake outside of uv (see docs/architecture.md);
# uv manages only the Python environment.
package = false

[tool.ruff.lint]
ignore = ["F722"]

[dependency-groups]
bench = [
    "diffrax>=0.7.2",
]
dev = [
    "pytest>=9.0.3",
    "scipy>=1.17.1",
]
docs = [
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.37",
]
