[build-system]
requires = ["maturin>=1.5", "jax>=0.4.31"]
build-backend = "maturin"

[project]
name = "diffsol-jax"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.7",
    "jax>=0.4.31",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "diffsol_jax._rust"

[dependency-groups]
dev = [
    "diffrax>=0.7.2",
    "ipython>=9.12.0",
    "optax>=0.2.8",
    "pytest>=9.0.3",
    "scipy>=1.17.1",
]
