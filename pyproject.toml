[build-system]
requires = ["maturin>=1.5", "jax>=0.10.2"]
build-backend = "maturin"

[project]
name = "diffsol-jax"
version = "0.0.2"
description = "JAX bindings for the diffsol Rust ODE solver, callable inside jax.jit and differentiable with jax.grad."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jack Montgomery", email = "jackbmontgomery2001@gmail.com" }]
keywords = ["jax", "ode", "differential-equations", "diffsol", "scientific-computing", "autodiff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.10.2",
]

[project.urls]
Homepage = "https://github.com/jackbmontgomery/diffsol-jax"
Repository = "https://github.com/jackbmontgomery/diffsol-jax"
Issues = "https://github.com/jackbmontgomery/diffsol-jax/issues"


[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "diffsol_jax._rust"

[tool.ruff.lint]
ignore = ["F722"]

[dependency-groups]
bench = [
    "diffrax>=0.7.2",
]
dev = [
    "diffrax>=0.7.2",
    "ipython>=9.12.0",
    "optax>=0.2.8",
    "pytest>=9.0.3",
    "scipy>=1.17.1",
]
docs = [
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.37",
]
