[build-system]
requires = ["scikit-build-core>=0.11", "jax>=0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "diffsol-jax"
version = "0.1.0"
description = "diffsol solves as JAX operations: write the ODE equations as JAX functions, use them in jax.jit, jax.vmap and jax.grad."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jack Montgomery", email = "jackbmontgomery2001@gmail.com" }]
keywords = ["jax", "ode", "differential-equations", "diffsol", "scientific-computing", "autodiff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.12",
    "jaxtyping>=0.3.9",
]

[project.optional-dependencies]
cpu = ["diffsol-jax-pjrt-cpu==0.12.*"]

[project.urls]
Homepage = "https://github.com/jackbmontgomery/diffsol-jax"
Repository = "https://github.com/jackbmontgomery/diffsol-jax"
Issues = "https://github.com/jackbmontgomery/diffsol-jax/issues"

[tool.scikit-build]
wheel.packages = ["python/diffsol_jax"]
wheel.py-api = "py3"
cmake.version = ">=3.20"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["python"]

[tool.ruff.lint]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"bench/bench.py" = ["B023", "PLR0124", "ISC004"]

[dependency-groups]
bench = [
    "diffrax>=0.7.2",
]
test = [
    "pytest>=9.0.3",
]
dev = [
    { include-group = "test" },
    "equinox>=0.13.7",
    "ipython>=9.18.1",
    "matplotlib>=3.11.2",
    "optax>=0.2.9",
    "pandas>=3.1.1",
    "tqdm>=4.70.1",
]
docs = [
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.37",
]
